<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · MTR Navigator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/panel.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body class="login-page">

<main class="login-card">
  <div class="panel-header">
    <div class="logo">MTR</div>
    <div class="header-text">
      <h1>MTR Navigator</h1>
      <p>Đăng nhập để tiếp tục</p>
    </div>
  </div>

  <form id="login-form" class="login-form" novalidate>
    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Mật khẩu</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="toggle-password" class="toggle-password" type="button">Hiện</button>
      </div>
    </div>

    <label class="remember-row">
      <input id="remember" type="checkbox">
      Ghi nhớ đăng nhập trên máy này
    </label>

    <div id="login-error" class="login-error" role="alert" hidden></div>

    <button id="login-submit" class="btn primary login-submit" type="submit">Đăng nhập</button>
  </form>

  <p class="login-footnote">
    Quản trị viên có thể chặn đoạn metro khi có sự cố; người dùng xem tuyến và tìm đường tránh các đoạn đang tạm dừng.
  </p>
</main>

<div id="file-protocol-warning" class="file-protocol-warning" hidden>
  Ứng dụng dùng ES modules nên không mở trực tiếp bằng <code>file://</code> được.<br>
  Hãy chạy qua web server, ví dụ <code>npx serve .</code> hoặc Live Server của VS Code.
</div>
<script>
  if (location.protocol === 'file:') document.getElementById('file-protocol-warning').hidden = false;
</script>
<script type="module" src="js/login.js"></script>
</body>
</html>
